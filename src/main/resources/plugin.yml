name: TokenSMP
version: 1.0.0
main: com.tokensmp.TokenSMPPlugin
api-version: '1.21'
authors: [Codex]
commands:
  tokens:
    description: Open your token menu
    usage: /tokens
  tokeninfo:
    description: View all token information
    usage: /tokeninfo
  spin:
    description: Trigger spin animation manually
    usage: /spin
  tokensmp:
    description: Admin management command
    usage: /tokensmp
permissions:
  tokensmp.admin:
    default: op
  tokensmp.spin.manual:
    default: true
